title: দোয়া সংকলন (Dua Collection)
description: বাংলাভাষী মুসলিমদের জন্য দোয়া, নামাজ, হজ্জ ও উমরাহ সংক্রান্ত সংকলন
lang: bn

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-relative-links

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
  - .bundle
